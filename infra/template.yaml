AWSTemplateFormatVersion: "2010-09-09"
Description: Disposable AWS-native customer support assistant

Parameters:
  EnvironmentName:
    Type: String
    Default: demo
    AllowedPattern: "[a-z][a-z0-9-]{1,15}"
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  ModelId:
    Type: String
    Default: us.amazon.nova-pro-v1:0
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  DemoExpiresAt:
    Type: String
    Description: ISO-8601 timestamp after which new customer sessions are disabled.
  DailyChatLimit:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 100
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Resources:
  ProductTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: customer-support-assistant
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Lifecycle
          Value: disposable-demo

  ChatDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true

  ChatQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ChatDeadLetterQueue.Arn
        maxReceiveCount: 3

  KnowledgeDocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-demo-documents
            Status: Enabled
            ExpirationInDays: 14

  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VectorBucketName: !Sub "support-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}"

  VectorIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
      IndexName: policies
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: knowledge-source-and-vectors
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt KnowledgeDocumentsBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "${KnowledgeDocumentsBucket.Arn}/policies/*"
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
              - Effect: Allow
                Action:
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:GetIndex
                Resource: !GetAtt VectorIndex.IndexArn

  VectorBucketPolicy:
    Type: AWS::S3Vectors::VectorBucketPolicy
    Properties:
      VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
      Policy:
        Version: "2012-10-17"
        Statement:
          - Sid: KnowledgeBaseOnly
            Effect: Allow
            Principal:
              AWS: !GetAtt KnowledgeBaseRole.Arn
            Action:
              - s3vectors:PutVectors
              - s3vectors:GetVectors
              - s3vectors:DeleteVectors
              - s3vectors:QueryVectors
              - s3vectors:GetIndex
            Resource: !GetAtt VectorIndex.IndexArn

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: VectorBucketPolicy
    Properties:
      Name: !Sub "support-policies-${EnvironmentName}"
      Description: Grounded fictional store policies for the support demonstration.
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions: 1024
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn: !GetAtt VectorIndex.IndexArn
      Tags:
        Project: customer-support-assistant
        Environment: !Ref EnvironmentName
        Lifecycle: disposable-demo

  KnowledgeDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: !Sub "support-policy-documents-${EnvironmentName}"
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt KnowledgeDocumentsBucket.Arn
          InclusionPrefixes: [policies/]
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 300
            OverlapPercentage: 10

  CustomerSupportGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "support-assistant-${EnvironmentName}"
      Description: Blocks unsafe content, prompt attacks, and sensitive identifiers.
      BlockedInputMessaging: This request cannot be processed under the support safety policy.
      BlockedOutputsMessaging: This response cannot be provided under the support safety policy.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: CREDIT_DEBIT_CARD_NUMBER
            Action: BLOCK
          - Type: US_SOCIAL_SECURITY_NUMBER
            Action: BLOCK
          - Type: PASSWORD
            Action: BLOCK

  CustomerSupportGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt CustomerSupportGuardrail.GuardrailId
      Description: !Sub "Published ${EnvironmentName} demonstration policy"

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: product-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource: !GetAtt ProductTable.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ChatQueue.Arn

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole"
      Policies:
        - PolicyName: support-inference
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt ProductTable.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:ApplyGuardrail
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                  - !GetAtt CustomerSupportGuardrail.GuardrailArn
              - Effect: Allow
                Action: bedrock:Retrieve
                Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: support_service.runtime.api_handler
      Role: !GetAtt ApiRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          PRODUCT_TABLE_NAME: !Ref ProductTable
          CHAT_QUEUE_URL: !Ref ChatQueue
          DAILY_CHAT_LIMIT: !Ref DailyChatLimit
          DEMO_EXPIRES_AT: !Ref DemoExpiresAt

  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: support_service.runtime.worker_handler
      Role: !GetAtt WorkerRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          PRODUCT_TABLE_NAME: !Ref ProductTable
          CHAT_QUEUE_URL: !Ref ChatQueue
          DAILY_CHAT_LIMIT: !Ref DailyChatLimit
          DEMO_EXPIRES_AT: !Ref DemoExpiresAt
          BEDROCK_MODEL_ID: !Ref ModelId
          BEDROCK_KNOWLEDGE_BASE_ID: !Ref KnowledgeBase
          BEDROCK_GUARDRAIL_ID: !GetAtt CustomerSupportGuardrail.GuardrailId
          BEDROCK_GUARDRAIL_VERSION: !GetAtt CustomerSupportGuardrailVersion.Version
          KNOWLEDGE_POLICY_PATH: /var/task/knowledge/policies/store-policies.md

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: !Ref LogRetentionDays

  WorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WorkerFunction}"
      RetentionInDays: !Ref LogRetentionDays

  WorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ChatQueue.Arn
      FunctionName: !Ref WorkerFunction
      BatchSize: 5
      FunctionResponseTypes: [ReportBatchItemFailures]

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/http-api/support-${EnvironmentName}"
      RetentionInDays: !Ref LogRetentionDays

  ApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "support-assistant-${EnvironmentName}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders: [authorization, content-type, idempotency-key]
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowOrigins:
          - http://localhost:5173
          - !Sub "https://${WebDistribution.DomainName}"
        MaxAge: 300
      Tags:
        Project: customer-support-assistant
        Environment: !Ref EnvironmentName
        Lifecycle: disposable-demo

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiGateway
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 15000

  OperatorAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref ApiGateway
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      Name: cognito-operators
      JwtConfiguration:
        Audience: [!Ref OperatorClient]
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${OperatorUserPool}"

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: GET /health
      Target: !Sub "integrations/${ApiIntegration}"
  CreateSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: POST /sessions
      Target: !Sub "integrations/${ApiIntegration}"
  SubmitMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: POST /sessions/{sessionId}/messages
      Target: !Sub "integrations/${ApiIntegration}"
  GetMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: GET /sessions/{sessionId}/messages/{requestId}
      Target: !Sub "integrations/${ApiIntegration}"
  CreateDraftRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: POST /sessions/{sessionId}/ticket-drafts
      Target: !Sub "integrations/${ApiIntegration}"
  ConfirmDraftRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: POST /sessions/{sessionId}/ticket-drafts/{draftId}/confirm
      Target: !Sub "integrations/${ApiIntegration}"
  GetTicketRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: GET /sessions/{sessionId}/tickets/{ticketId}
      Target: !Sub "integrations/${ApiIntegration}"
  ListOperatorTicketsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: GET /operator/tickets
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref OperatorAuthorizer
  GetOperatorTicketRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: GET /operator/tickets/{ticketId}
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref OperatorAuthorizer
  UpdateOperatorTicketRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: PATCH /operator/tickets/{ticketId}
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref OperatorAuthorizer

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGateway
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      Tags:
        Project: customer-support-assistant
        Environment: !Ref EnvironmentName

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*"

  OperatorUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "support-operators-${EnvironmentName}"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      UserPoolTags:
        Project: customer-support-assistant
        Environment: !Ref EnvironmentName

  OperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: operators
      Description: Staff allowed to use the support operations desk.
      UserPoolId: !Ref OperatorUserPool

  OperatorClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OperatorUserPool
      ClientName: support-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Sub "https://${WebDistribution.DomainName}/auth/callback"
        - http://localhost:5173/auth/callback
      LogoutURLs:
        - !Sub "https://${WebDistribution.DomainName}/"
        - http://localhost:5173/
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED

  OperatorDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "support-${EnvironmentName}-${AWS::AccountId}"
      UserPoolId: !Ref OperatorUserPool

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "support-web-${EnvironmentName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Disposable support assistant ${EnvironmentName}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: web-assets
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web-assets
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Lambda errors during a disposable demonstration.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A support chat message reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ChatDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !GetAtt ApiGateway.ApiEndpoint
  WebUrl:
    Value: !Sub "https://${WebDistribution.DomainName}"
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref WebDistribution
  KnowledgeDocumentsBucketName:
    Value: !Ref KnowledgeDocumentsBucket
  KnowledgeBaseId:
    Value: !Ref KnowledgeBase
  KnowledgeDataSourceId:
    Value: !GetAtt KnowledgeDataSource.DataSourceId
  UserPoolId:
    Value: !Ref OperatorUserPool
  UserPoolClientId:
    Value: !Ref OperatorClient
  CognitoDomain:
    Value: !Sub "https://${OperatorDomain}.auth.${AWS::Region}.amazoncognito.com"
  ProductTableName:
    Value: !Ref ProductTable
  ChatQueueUrl:
    Value: !Ref ChatQueue
  DemoExpiresAt:
    Value: !Ref DemoExpiresAt
