AWSTemplateFormatVersion: '2010-09-09'
Description: Customer Support Chatbot - Bedrock Evaluations & Testing Infrastructure (S3, IAM)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage/environment name.

  JudgeModelId:
    Type: String
    Default: amazon.nova-pro-v1:0
    Description: Model ID used as judge for Bedrock Evaluations.

Resources:
  EvalDatasetBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "support-eval-datasets-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: CleanOldEvalDatasets
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Project
          Value: CustomerSupportChatbot
        - Key: Environment
          Value: !Ref EnvironmentName

  BedrockEvalRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "support-bedrock-eval-role-${EnvironmentName}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockEvalStorageAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt EvalDatasetBucket.Arn
                  - !Sub "${EvalDatasetBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${JudgeModelId}"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
      Tags:
        - Key: Project
          Value: CustomerSupportChatbot
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  EvalDatasetBucketName:
    Description: Name of the S3 bucket for evaluation datasets
    Value: !Ref EvalDatasetBucket
    Export:
      Name: !Sub "${AWS::StackName}-EvalDatasetBucketName"

  EvalDatasetBucketArn:
    Description: ARN of the S3 bucket for evaluation datasets
    Value: !GetAtt EvalDatasetBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EvalDatasetBucketArn"

  BedrockEvalRoleArn:
    Description: ARN of the IAM role for Bedrock Evaluations
    Value: !GetAtt BedrockEvalRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BedrockEvalRoleArn"
